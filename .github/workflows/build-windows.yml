name: Build Windows app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish as a release (e.g. 0.1.0). Leave empty for a test build."
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mediapipe opencv-python numpy pandas matplotlib pillow pyinstaller

      - name: Download the face model to bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force models | Out-Null
          Invoke-WebRequest "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" -OutFile models\face_landmarker.task
          dir models

      - name: Build DeceptiveGestures.exe
        run: >
          pyinstaller apps/launcher.py --name DeceptiveGestures --windowed --noconfirm --clean
          --icon packaging/deceptive_gestures.ico
          --paths .
          --collect-all mediapipe
          --hidden-import apps.session_app --hidden-import apps.class_app
          --hidden-import dg.simulate --hidden-import matplotlib.backends.backend_agg
          --exclude-module torch --exclude-module sklearn --exclude-module scipy
          --add-data "models;models"
          --add-data "materials;materials"
          --add-data "packaging/deceptive_gestures.ico;packaging"

      - name: Smoke test the built app (window + bundled face model)
        shell: pwsh
        run: |
          $exe = "dist\DeceptiveGestures\DeceptiveGestures.exe"
          $w = Start-Process $exe -ArgumentList "--check-window" -Wait -PassThru
          $s = Start-Process $exe -ArgumentList "--self-test" -Wait -PassThru
          $home_dir = "$env:USERPROFILE\Documents\DeceptiveGestures"
          if (Test-Path "$home_dir\last_error.txt") { Get-Content "$home_dir\last_error.txt" }
          if (Test-Path "$home_dir\self_test.txt") { Get-Content "$home_dir\self_test.txt" }
          $okw = Test-Path "$home_dir\window_check_ok.txt"
          Write-Host "window exit $($w.ExitCode) opened $okw; self-test exit $($s.ExitCode)"
          if ($w.ExitCode -ne 0 -or -not $okw -or $s.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: start-window
          path: ~/Documents/DeceptiveGestures/start_window.png
          if-no-files-found: ignore

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } elseif ("${{ inputs.version }}" -ne "") { "${{ inputs.version }}" } else { "0.0.0-dev" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\installer.iss
          Compress-Archive -Path dist\DeceptiveGestures -DestinationPath "dist\DeceptiveGestures-portable-$v.zip"
          dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: DeceptiveGestures-windows
          path: |
            dist/DeceptiveGestures-Setup-*.exe
            dist/DeceptiveGestures-portable-*.zip

      - name: Publish release
        if: github.ref_type == 'tag' || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          name: Deceptive Gestures ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/DeceptiveGestures-Setup-*.exe
            dist/DeceptiveGestures-portable-*.zip
          body: |
            **Download `DeceptiveGestures-Setup-*.exe`, run it, then click the Deceptive Gestures icon on your desktop.**

            No Python needed. Works offline (the face model is included). No image or video is ever saved: only numbers.
            Windows may show "Windows protected your PC" because the app is not code-signed: click **More info -> Run anyway**.

            Data and materials go to `Documents\DeceptiveGestures`. Put the lecture clips in `materials\videos` and edit `materials\videos.json` before the first real session. "Try a session without the camera" works straight away.

            `DeceptiveGestures-portable-*.zip` is the same app without installing: unzip and double-click `DeceptiveGestures.exe`.
